
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico P2</title>
</head>
<body>

<h2>Diagnóstico Bluetooth P2</h2>

<button id="conectar">Conectar P2</button>
<button id="probar" disabled>Probar canales</button>
<button id="identificar" disabled>
  Identificar protocolo P2
</button>
<pre id="resultado">Esperando conexión...</pre>

<script>
const UUID = {
  ff00: "0000ff00-0000-1000-8000-00805f9b34fb",
  ff01: "0000ff01-0000-1000-8000-00805f9b34fb",
  ff02: "0000ff02-0000-1000-8000-00805f9b34fb",
  ff03: "0000ff03-0000-1000-8000-00805f9b34fb",
  ff10: "0000ff10-0000-1000-8000-00805f9b34fb",
  ff11: "0000ff11-0000-1000-8000-00805f9b34fb",
  ff12: "0000ff12-0000-1000-8000-00805f9b34fb"
};

let services = {};
let characteristics = {};

const output = document.getElementById("resultado");

function log(message) {
  output.textContent += "\n" + message;
}

function listen(characteristic, name) {
  characteristic.addEventListener(
    "characteristicvaluechanged", event => {
      const value = event.target.value;
      const data = new Uint8Array(
        value.buffer, value.byteOffset, value.byteLength
      );

      const hex = [...data]
        .map(b => b.toString(16).padStart(2, "0"))
        .join(" ");

      log(name + " RECIBIDO: " + hex);
    }
  );
}

document.getElementById("conectar").onclick =
async () => {
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "P2" }],
      optionalServices: [UUID.ff00, UUID.ff10]
    });

    log("Dispositivo: " + device.name);

    const server = await device.gatt.connect();

    for (const [name, id] of [
      ["ff00", UUID.ff00],
      ["ff10", UUID.ff10]
    ]) {
      try {
        services[name] = await server.getPrimaryService(id);
        log("Servicio " + name + " conectado.");
      } catch (e) {
        log("Servicio " + name + ": " + e.message);
      }
    }

    for (const [name, service, ids] of [
      ["ff00", services.ff00, ["ff01", "ff02", "ff03"]],
      ["ff10", services.ff10, ["ff11", "ff12"]]
    ]) {
      if (!service) continue;

      for (const id of ids) {
        try {
          const ch = await service.getCharacteristic(UUID[id]);
          characteristics[id] = ch;

          if (["ff01", "ff03", "ff11", "ff12"].includes(id)) {
            listen(ch, id);
            await ch.startNotifications();
            log("Notificaciones activadas: " + id);
          }
        } catch (e) {
          log("Error " + id + ": " + e.message);
        }
      }
    }

    document.getElementById("probar").disabled = false;
    document.getElementById("identificar").disabled = false;
    log("Diagnóstico listo.");

  } catch (e) {
    log("ERROR: " + e.message);
  }
};

document.getElementById("probar").onclick =
async () => {
  const commands = [
    ["ff02", [0x10, 0xFF, 0x20, 0xF0]],
    ["ff12", [0x10, 0xFF, 0x20, 0xF0]],
    ["ff11", [0x10, 0xFF, 0x20, 0xF0]]
  ];

  for (const [id, bytes] of commands) {
    if (!characteristics[id]) continue;

    try {
      const ch = characteristics[id];
      const data = new Uint8Array(bytes);

      if (ch.properties.writeWithoutResponse) {
        await ch.writeValueWithoutResponse(data);
      } else if (ch.properties.write) {
        await ch.writeValueWithResponse(data);
      }

      log("Enviado por " + id + ": " + bytes.join(","));

      await new Promise(resolve => setTimeout(resolve, 1200));

    } catch (e) {
      log("Error enviando por " + id + ": " + e.message);
    }
  }

  log("Pruebas terminadas.");
};
document.getElementById("identificar").onclick =
async () => {

  const commands = [
    ["Firmware", [0x10, 0xFF, 0x20, 0xF1]],
    ["Número de serie", [0x10, 0xFF, 0x20, 0xF2]],
    ["Estado", [0x10, 0xFF, 0x40]]
  ];

  for (const [name, bytes] of commands) {
    try {
      await characteristics["ff02"].writeValueWithoutResponse(
  new Uint8Array(bytes)
);

      log("Consulta enviada: " + name);

      await new Promise(resolve =>
        setTimeout(resolve, 1500)
      );

    } catch (error) {
      log("Error: " + error.message);
    }
  }
};
</script>

</body>
</html>
