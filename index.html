
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de impresión P2</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 20px;
  background: #f4f4f4;
}
button {
  display: block;
  width: 100%;
  padding: 15px;
  margin: 12px 0;
  font-size: 16px;
  border: 0;
  border-radius: 8px;
  background: #222;
  color: white;
}
button:disabled {
  opacity: .4;
}
pre {
  background: #fff;
  padding: 12px;
  border-radius: 8px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<h2>Impresora P2</h2>

<button id="conectar">1. Conectar P2</button>
<button id="imprimir" disabled>
  2. Imprimir etiqueta de prueba
</button>

<pre id="resultado">Esperando conexión...</pre>

<script>

const SERVICE =
"0000ff00-0000-1000-8000-00805f9b34fb";

const TX =
"0000ff02-0000-1000-8000-00805f9b34fb";

const FLOW =
"0000ff03-0000-1000-8000-00805f9b34fb";

let printer;
let tx;
let flow;

let credits = 0;
let waiters = [];

const output = document.getElementById("resultado");

function log(message) {
  output.textContent += "\n" + message;
}

// Recibir créditos de transmisión
function onFlow(event) {

  const value = event.target.value;

  const data = new Uint8Array(
    value.buffer,
    value.byteOffset,
    value.byteLength
  );

  const hex = [...data]
    .map(b => b.toString(16).padStart(2, "0"))
    .join(" ");

  log("FF03: " + hex);

  // Protocolo de créditos: 01 + cantidad
  if (data.length >= 2 && data[0] === 0x01) {

    credits += data[1];

    log("Créditos disponibles: " + credits);

    while (credits > 0 && waiters.length > 0) {

      credits--;

      const waiter = waiters.shift();
      waiter.resolve();
    }
  }
}

// Esperar un crédito antes de enviar cada paquete
function waitCredit() {

  if (credits > 0) {
    credits--;
    return Promise.resolve();
  }

  return new Promise((resolve, reject) => {

    const waiter = {
      resolve: () => {
        clearTimeout(timer);
        resolve();
      },
      reject
    };

    const timer = setTimeout(() => {

      const index = waiters.indexOf(waiter);

      if (index !== -1) {
        waiters.splice(index, 1);
      }

      reject(new Error(
        "Tiempo agotado esperando crédito Bluetooth"
      ));

    }, 10000);

    waiters.push(waiter);
  });
}

// Conexión Bluetooth
document.getElementById("conectar").onclick =
async () => {

  try {

    document.getElementById("conectar").disabled = true;

    printer = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "P2" }],
      optionalServices: [SERVICE]
    });

    log("Dispositivo: " + printer.name);

    const server = await printer.gatt.connect();

    const service =
      await server.getPrimaryService(SERVICE);

    tx = await service.getCharacteristic(TX);

    flow = await service.getCharacteristic(FLOW);

    flow.addEventListener(
      "characteristicvaluechanged",
      onFlow
    );

    await flow.startNotifications();

    log("Canal de impresión preparado.");
    log("Esperando créditos de transmisión...");

    document.getElementById("imprimir").disabled = false;

    printer.addEventListener(
      "gattserverdisconnected",
      () => {
        document.getElementById("imprimir").disabled = true;
        log("Impresora desconectada.");
      }
    );

  } catch (error) {

    log("ERROR: " + error.message);

    document.getElementById("conectar").disabled = false;
  }
};

// Enviar datos por paquetes BLE
async function sendData(data) {

  const CHUNK_SIZE = 20;

  for (let i = 0; i < data.length; i += CHUNK_SIZE) {

    const chunk = data.slice(i, i + CHUNK_SIZE);

    await waitCredit();

    try {

      await tx.writeValueWithoutResponse(chunk);

      log("Paquete enviado: " +
        Math.min(i + CHUNK_SIZE, data.length) +
        " / " + data.length);

    } catch (error) {

      credits++;

      throw error;
    }
  }
}

// Construir etiqueta TSPL
function buildLabel() {

  const commands = [
    "SIZE 50 mm,30 mm",
    "GAP 2 mm,0 mm",
    "DENSITY 8",
    "SPEED 3",
    "DIRECTION 0,0",
    "CLS",

    'TEXT 30,30,"3",0,1,1,"SENSHI-KAN"',
    'TEXT 30,95,"3",0,1,1,"PRUEBA P2"',
    'TEXT 30,160,"2",0,1,1,"50 x 30 mm"',

    "PRINT 1,1"
  ];

  return new TextEncoder().encode(
    commands.join("\r\n") + "\r\n"
  );
}

// Imprimir
document.getElementById("imprimir").onclick =
async () => {

  try {

    document.getElementById("imprimir").disabled = true;

    log("Preparando etiqueta...");

    const data = buildLabel();

    log("Tamaño del trabajo: " + data.length + " bytes");

    await sendData(data);

    log("Todos los datos fueron enviados.");

    log("Esperando impresión...");

  } catch (error) {

    log("ERROR DE IMPRESIÓN: " + error.message);

  } finally {

    document.getElementById("imprimir").disabled = false;
  }
};

</script>

</body>
</html>
