
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico Bluetooth - Impresora P2</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .contenedor {
      max-width: 520px;
      margin: 20px auto;
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0002;
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #estado {
      padding: 12px;
      background: #eee;
      border-radius: 8px;
      font-size: 14px;
      margin: 15px 0;
    }

    #registro {
      background: #111;
      color: #00ff8c;
      padding: 12px;
      border-radius: 8px;
      min-height: 180px;
      max-height: 350px;
      overflow-y: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="contenedor">
    <h2>Diagnóstico de impresora P2</h2>

    <p>
      Conecte la impresora por Bluetooth y ejecute la prueba
      para comprobar si responde al protocolo L11.
    </p>

    <button id="conectar">
      1. Conectar impresora
    </button>

    <button id="diagnostico" disabled>
      2. Probar protocolo L11
    </button>

    <button id="limpiar">
      Limpiar registro
    </button>

    <div id="estado">
      Estado: esperando conexión
    </div>

    <h3>Registro de comunicación</h3>
    <div id="registro"></div>
  </div>

  <script>
    // UUID de los servicios y características BLE
    const SERVICE_FF00 =
      "0000ff00-0000-1000-8000-00805f9b34fb";

    const TX_FF02 =
      "0000ff02-0000-1000-8000-00805f9b34fb";

    const RX_FF01 =
      "0000ff01-0000-1000-8000-00805f9b34fb";

    let dispositivo = null;
    let servidor = null;
    let servicio = null;
    let tx = null;
    let rx = null;

    const botonConectar =
      document.getElementById("conectar");

    const botonDiagnostico =
      document.getElementById("diagnostico");

    const botonLimpiar =
      document.getElementById("limpiar");

    const estado =
      document.getElementById("estado");

    const registro =
      document.getElementById("registro");


    // Agregar mensajes al registro
    function log(mensaje) {
      const hora = new Date().toLocaleTimeString();

      registro.textContent +=
        "[" + hora + "] " + mensaje + "\n";

      registro.scrollTop = registro.scrollHeight;
    }


    // Convertir bytes a hexadecimal
    function aHex(datos) {
      return Array.from(datos)
        .map(b => b.toString(16).padStart(2, "0"))
        .join(" ")
        .toUpperCase();
    }


    // Actualizar estado visual
    function cambiarEstado(mensaje) {
      estado.textContent = "Estado: " + mensaje;
    }


    // Recibir respuestas de la impresora
    function recibirDatos(evento) {
      const datos = new Uint8Array(
        evento.target.value.buffer,
        evento.target.value.byteOffset,
        evento.target.value.byteLength
      );

      log("FF01 RECIBIDO: " + aHex(datos));
    }


    // Conectar con la impresora
    async function conectar() {
      try {
        botonConectar.disabled = true;
        cambiarEstado("buscando impresora...");
        log("Buscando dispositivo Bluetooth...");

        dispositivo = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: "P2" }
          ],
          optionalServices: [
            SERVICE_FF00
          ]
        });

        log("Dispositivo seleccionado: " + dispositivo.name);

        dispositivo.addEventListener(
          "gattserverdisconnected",
          () => {
            log("La impresora se desconectó.");
            cambiarEstado("desconectada");
            botonDiagnostico.disabled = true;
            tx = null;
            rx = null;
          }
        );

        cambiarEstado("conectando...");

        servidor = await dispositivo.gatt.connect();

        log("Conexión GATT establecida.");

        servicio = await servidor.getPrimaryService(
          SERVICE_FF00
        );

        log("Servicio FF00 encontrado.");

        tx = await servicio.getCharacteristic(
          TX_FF02
        );

        log("Canal de escritura FF02 encontrado.");

        rx = await servicio.getCharacteristic(
          RX_FF01
        );

        log("Canal de recepción FF01 encontrado.");

        // Activar notificaciones antes de enviar comandos
        await rx.startNotifications();

        rx.addEventListener(
          "characteristicvaluechanged",
          recibirDatos
        );

        log("Notificaciones FF01 activadas.");

        cambiarEstado("impresora conectada y lista");
        botonDiagnostico.disabled = false;

      } catch (error) {
        log("ERROR DE CONEXIÓN: " + error.message);
        cambiarEstado("error de conexión");
        botonConectar.disabled = false;
      }
    }


    // Enviar datos a la impresora por FF02
    async function enviar(datos, descripcion) {
      try {
        log("Enviando: " + descripcion);
        log("Bytes: " + aHex(datos));

        if (tx.properties.writeWithoutResponse) {
          await tx.writeValueWithoutResponse(
            new Uint8Array(datos)
          );
        } else {
          await tx.writeValueWithResponse(
            new Uint8Array(datos)
          );
        }

        log("Comando transmitido correctamente.");

      } catch (error) {
        log("ERROR AL ENVIAR: " + error.message);
        throw error;
      }
    }


    // Pausa entre comandos
    function esperar(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }


    // Prueba del protocolo L11
    async function probarL11() {
      try {
        if (!tx || !rx || !dispositivo?.gatt?.connected) {
          log("No hay una conexión activa.");
          return;
        }

        botonDiagnostico.disabled = true;

        log("--------------------------------");
        log("INICIANDO PRUEBA DEL PROTOCOLO L11");
        log("--------------------------------");

        cambiarEstado("ejecutando diagnóstico L11...");

        // 1. Wakeup: 15 bytes en cero
        const wakeup = new Array(15).fill(0);

        await enviar(
          wakeup,
          "Despertar impresora (WAKEUP)"
        );

        await esperar(1000);

        // 2. Activar impresora
        await enviar(
          [0x10, 0xFF, 0xF1, 0x02],
          "Activar impresora L11"
        );

        await esperar(1000);

        // 3. Consultar modelo
        await enviar(
          [0x10, 0xFF, 0x20, 0xF0],
          "Consultar modelo de impresora"
        );

        await esperar(3000);

        log("--------------------------------");
        log("PRUEBA FINALIZADA.");
        log("Revise si se recibieron datos por FF01.");
        log("--------------------------------");

        cambiarEstado("prueba finalizada");

      } catch (error) {
        log("ERROR EN DIAGNÓSTICO: " + error.message);
        cambiarEstado("error durante diagnóstico");

      } finally {
        botonDiagnostico.disabled = false;
      }
    }


    // Eventos de botones
    botonConectar.addEventListener(
      "click",
      conectar
    );

    botonDiagnostico.addEventListener(
      "click",
      probarL11
    );

    botonLimpiar.addEventListener(
      "click",
      () => {
        registro.textContent = "";
      }
    );


    // Comprobar compatibilidad con Web Bluetooth
    if (!navigator.bluetooth) {
      cambiarEstado(
        "este navegador no admite Web Bluetooth"
      );

      botonConectar.disabled = true;

      log(
        "Abra esta página desde Chrome en Android."
      );
    }

  </script>

</body>
</html>
