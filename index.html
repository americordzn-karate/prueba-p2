
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba ESC/POS P2</title>
<style>
body{font-family:Arial;background:#f2f2f2;padding:15px}
main{max-width:500px;margin:auto;background:white;padding:20px;border-radius:12px}
button{width:100%;padding:15px;margin:8px 0;background:#222;color:white;border:0;border-radius:8px;font-size:16px}
button:disabled{background:#999}
#log{background:#111;color:#00ff90;padding:12px;font:12px monospace;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h2>Prueba ESC/POS - Holyhah P2</h2>
<button id="connect">1. Conectar impresora</button>
<button id="print" disabled>2. Imprimir prueba</button>
<button id="clear">Limpiar registro</button>
<div id="status">Desconectado</div>
<pre id="log"></pre>
</main>

<script>
const SERVICE="0000ff00-0000-1000-8000-00805f9b34fb";
const TX="0000ff02-0000-1000-8000-00805f9b34fb";

let device, tx;

const logBox=document.getElementById("log");
const statusBox=document.getElementById("status");
const connectBtn=document.getElementById("connect");
const printBtn=document.getElementById("print");

function log(t){
  logBox.textContent+="["+new Date().toLocaleTimeString()+"] "+t+"\n";
  logBox.scrollTop=logBox.scrollHeight;
}

async function connect(){
  try{
    connectBtn.disabled=true;
    statusBox.textContent="Buscando impresora...";

    device=await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:"P2"}],
      optionalServices:[SERVICE]
    });

    log("Dispositivo: "+device.name);

    device.addEventListener("gattserverdisconnected",()=>{
      statusBox.textContent="Desconectado";
      printBtn.disabled=true;
      connectBtn.disabled=false;
      tx=null;
    });

    const server=await device.gatt.connect();
    const service=await server.getPrimaryService(SERVICE);
    tx=await service.getCharacteristic(TX);

    statusBox.textContent="Conectado";
    printBtn.disabled=false;
    log("Conexión establecida.");

  }catch(e){
    log("ERROR: "+e.message);
    statusBox.textContent="Error de conexión";
    connectBtn.disabled=false;
  }
}

async function send(data){
  if(tx.properties.writeWithoutResponse){
    await tx.writeValueWithoutResponse(data);
  }else{
    await tx.writeValueWithResponse(data);
  }
}

async function printTest(){
  try{
    printBtn.disabled=true;
    log("Enviando prueba ESC/POS...");

    // Inicialización ESC/POS
    await send(new Uint8Array([0x1B,0x40]));
    await new Promise(r=>setTimeout(r,200));

    // Texto ASCII
    const text=new TextEncoder().encode("ESC/POS TEST");
    await send(text);
    await new Promise(r=>setTimeout(r,200));

    // Salto de línea
    await send(new Uint8Array([0x0A]));

    log("Datos enviados.");

  }catch(e){
    log("ERROR: "+e.message);
  }finally{
    printBtn.disabled=!tx;
  }
}

connectBtn.onclick=connect;
printBtn.onclick=printTest;

document.getElementById("clear").onclick=()=>{
  logBox.textContent="";
};

if(!navigator.bluetooth){
  statusBox.textContent="Abra esta página en Chrome Android";
  connectBtn.disabled=true;
}
</script>
</body>
</html>
